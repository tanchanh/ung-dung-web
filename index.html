    <style>
        :root {
            --bg-color: #080414;
            --card-bg: rgba(18, 12, 38, 0.5);
            --card-border: rgba(255, 255, 255, 0.06);
            --accent-primary: #8b5cf6;
            --accent-secondary: #d946ef;
            --gradient-accent: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
            --gradient-text: linear-gradient(to right, #ffffff, #d946ef);
            --gradient-btn-local: linear-gradient(135deg, #7c3aed 0%, #c026d3 100%);
            --gradient-btn-local-hover: linear-gradient(135deg, #6d28d9 0%, #a21caf 100%);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --html-color: #e34c26;
            --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(217, 70, 239, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
            padding: 3rem 1.5rem 5rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 30rem;
            width: 100%;
        }

        /* Hero Section */
        header {
            text-align: center;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-area {
            position: relative;
            margin-bottom: 0rem;
        }

        .avatar {
            width: 6.5rem;
            height: 6.5rem;
            border-radius: 50%;
            border: 3px solid rgba(139, 92, 246, 0.6);
            padding: 3px;
            background: var(--bg-color);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3);
            transition: var(--transition);
        }

        .profile-area:hover .avatar {
            transform: scale(1.1) rotate(5deg);
            border-color: var(--accent-secondary);
            box-shadow: 0 8px 30px rgba(217, 70, 239, 0.5);
        }

        .github-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--gradient-accent);
            border: 2px solid var(--bg-color);
            border-radius: 50%;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .github-badge svg {
            width: 1.1rem;
            height: 1.1rem;
            fill: #ffffff;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.75rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
            max-width: 35rem;
            margin-bottom: 1rem;
        }

        .stats-container {
            display: flex;
            gap: 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 0.75rem 1.75rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .stat-val {
            color: var(--accent-secondary);
            font-weight: 700;
        }

        /* Interactive Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            width: 100%;
        }

        /* Search Bar */
        .search-wrapper {
            position: relative;
            width: 100%;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.07);
            border-radius: 1rem;
            padding: 1.1rem 1.5rem 1.1rem 3.2rem;
            color: var(--text-main);
            font-size: 1.05rem;
            font-family: inherit;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            transition: var(--transition);
            width: 1.3rem;
            height: 1.3rem;
        }

        .search-input:focus+.search-icon {
            color: var(--accent-primary);
        }

        .clear-btn {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0.2rem;
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: var(--transition);
        }

        .clear-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Filter Chips */
        .filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .filter-btn.active {
            color: #ffffff;
            background: var(--gradient-btn-local);
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        /* Project List */
        .grid {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 100%;
            animation: fadeIn 0.6s ease-out;
        }

        /* Project Card (Minimal Row) */
        .card {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            transition: var(--transition);
        }

        .card:last-child {
            border-bottom: none;
        }

        .card:hover {
            border-color: rgba(217, 70, 239, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 0.1rem;
        }

        .card-title-link {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            color: #ffffff;
            transition: var(--transition);
        }

        .card-title-link:hover {
            color: var(--accent-secondary);
        }

        .card-icon {
            font-size: 1.4rem;
            line-height: 1;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: inherit;
            overflow-wrap: break-word;
            word-break: normal;
        }

        .card-description {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            margin-bottom: 0.1rem;
        }

        .card-meta {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .lang-indicator {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .lang-color {
            width: 0.75rem;
            height: 0.75rem;
            border-radius: 50%;
            background-color: var(--html-color);
        }

        /* Action Buttons */
        .card-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            border: none;
            border-radius: 0.8rem;
            padding: 0.75rem 1rem;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            text-decoration: none;
            width: 100%;
        }

        .btn-local {
            background: var(--gradient-btn-local);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.2);
        }

        .btn-local:hover {
            background: var(--gradient-btn-local-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(124, 58, 237, 0.3);
        }

        .btn-github {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        .btn-github:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        /* Empty State */
        .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
            grid-column: 1 / -1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1.5rem;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 4rem;
            height: 4rem;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        /* Footer */
        footer {
            margin-top: 5rem;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            max-width: 100%;
            width: 100%;
            line-height: 1.6;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 2rem;
        }

        footer a {
            color: var(--accent-secondary);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            body {
                padding: 2rem 1rem 4rem 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

            }
        ];

        // Hàm chuyển đổi chuỗi tiếng Việt sang dạng không dấu để hỗ trợ tìm kiếm dễ dàng
        function removeAccents(str) {
            if (!str) return "";
            return str
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/đ/g, "d")
                .replace(/Đ/g, "D");
        }

        // Khởi tạo các phần tử DOM
        const projectGrid = document.getElementById("project-grid");
        const searchBox = document.getElementById("search-box");
        const clearSearchBtn = document.getElementById("clear-search");
        const filtersContainer = document.getElementById("filters-container");
        const emptyState = document.getElementById("empty-state");
        const totalCountSpan = document.getElementById("total-count");

        let currentFilter = "all";
        let searchQuery = "";

        // Hàm dựng các nút bộ lọc tự động
        function renderFilters() {
            // Lấy danh sách các category thực tế có trong projectsData
            const activeCategories = [...new Set(projectsData.map(p => p.category))];

            let filtersHtml = `<button class="filter-btn active" data-filter="all">Tất cả</button>`;

            // Duyệt qua categoryMap để đảm bảo giữ nguyên thứ tự hiển thị mong muốn
            for (const [key, value] of Object.entries(categoryMap)) {
                if (activeCategories.includes(key)) {
                    filtersHtml += `<button class="filter-btn" data-filter="${key}">${value}</button>`;
                }
            }

            // Dự phòng: Nếu có category nào mới trong projectsData mà chưa được định nghĩa ở categoryMap
            activeCategories.forEach(cat => {
                if (!(cat in categoryMap)) {
                    filtersHtml += `<button class="filter-btn" data-filter="${cat}">${cat}</button>`;
                }
            });

            filtersContainer.innerHTML = filtersHtml;

            // Gắn sự kiện click cho các nút bộ lọc mới được tạo
            const buttons = filtersContainer.querySelectorAll(".filter-btn");
            buttons.forEach(btn => {
                btn.addEventListener("click", () => {
                    buttons.forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    currentFilter = btn.getAttribute("data-filter");
                    renderProjects();
                });
            });
        }

        // Hàm dựng cấu trúc thẻ dự án (HTML Card)
        function renderProjects() {
            projectGrid.innerHTML = "";

            // Chuẩn bị từ khóa tìm kiếm (chuyển sang chữ thường và loại bỏ dấu tiếng Việt)
            const cleanQuery = removeAccents(searchQuery).toLowerCase();

            // Lọc dữ liệu
            const filteredProjects = projectsData.filter(proj => {
                const matchesFilter = (currentFilter === "all" || proj.category === currentFilter);

                // Nếu bộ lọc không khớp thì không cần xử lý tìm kiếm để tối ưu hiệu năng
                if (!matchesFilter) return false;

                const categoryText = categoryMap[proj.category] || "";
                const searchStr = removeAccents(`${proj.title} ${proj.name} ${proj.description} ${categoryText}`).toLowerCase();
                return searchStr.includes(cleanQuery);
            });

            // Cập nhật số lượng
            totalCountSpan.textContent = filteredProjects.length;

            if (filteredProjects.length === 0) {
                emptyState.style.display = "flex";
                return;
            }

            emptyState.style.display = "none";

            // Hiển thị danh sách các thẻ
            filteredProjects.forEach(proj => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <a href="https://tanchanh.github.io/${proj.name}/" target="_blank" rel="noopener" class="card-title-link">
                            <span class="card-icon">${proj.emoji}</span>
                            <h3 class="card-title">${proj.title}</h3>
                        </a>
                    </div>
                    <p class="card-description">${proj.description}</p>
                    <div class="card-meta">Cập nhật: ${proj.updated}</div>
                `;
                projectGrid.appendChild(card);
            });
        }

        // Xử lý sự kiện khi gõ ô tìm kiếm
        searchBox.addEventListener("input", (e) => {
            searchQuery = e.target.value;
            if (searchQuery.trim() !== "") {
                clearSearchBtn.style.display = "flex";
            } else {
                clearSearchBtn.style.display = "none";
            }
            renderProjects();
        });

        // Xử lý nút xoá tìm kiếm
        clearSearchBtn.addEventListener("click", () => {
            searchBox.value = "";
            searchQuery = "";
            clearSearchBtn.style.display = "none";
            renderProjects();
            searchBox.focus();
        });

        // Khởi tạo bộ lọc và danh sách dự án lần đầu khi tải trang
        renderFilters();
        renderProjects();
    </script>
</body>

</html>
